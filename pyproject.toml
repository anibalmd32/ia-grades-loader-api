[project]
name = "ia-grades-loader-api"
version = "0.1.0"
description = "API para la carga y consulta de notas universitarias asistida por IA"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncmy>=0.2.16",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.143.0",
    "fastmcp>=4.1.0",
    "openai>=3.29.0",
    "openpyxl>=3.1.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-telegram-bot>=22.8",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
